<h2>{{ category }}</h2>

<div class="page-layout">
  <!-- المنتجات -->
  <div class="products-section" id="products-section">
    <div class="mobile-filter-bar">
      <button
        class="filter-toggle"
        type="button"
        (click)="toggleFilters()"
        aria-label="Open filters"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path
            d="M3 5h18M7 12h10M10 19h4"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      </button>
    </div>

    <div class="product-list" *ngIf="filteredProducts.length > 0; else noResults">
      <app-product-card
        *ngFor="let product of filteredProducts"
        [product]="product"
        (addToCart)="onAddToCart($event)"
      >
      </app-product-card>
    </div>

    <ng-template #noResults>
      <div class="no-results">
        <h3>No products found</h3>
        <p *ngIf="allProducts.length > 0">Try adjusting your filters or resetting them.</p>
        <p *ngIf="allProducts.length === 0">No products available in this category.</p>

        <button (click)="resetAllFilters()">Reset Filters</button>
      </div>
    </ng-template>
  </div>

  <!-- السايدبار -->
  <div class="filter-drawer" [class.open]="filtersOpen">
    <div class="drawer-backdrop" (click)="closeFilters()"></div>
    <div class="drawer-panel" (click)="$event.stopPropagation()">
      <div class="drawer-header">
        <h4>Filters</h4>
        <lucide-icon
          class="drawer-close-icon"
          name="x"
          [size]="18"
          role="button"
          tabindex="0"
          aria-label="Close filters"
          (click)="closeFilters()"
          (keydown.enter)="closeFilters()"
        ></lucide-icon>
      </div>
      <app-product-filter
        [maxAvailablePrice]="maxPriceInProducts"
        (filterChange)="applyFilters($event)"
      >
      </app-product-filter>
    </div>
  </div>
</div>
