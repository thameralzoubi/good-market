<header class="header" [class.compact]="isCompactHeader" (click)="closeDropdown()">
  <div class="container">
    <!-- Logo -->
    <button class="back-button" *ngIf="showBackButton" (click)="goBack($event)">
      <lucide-icon name="arrow-left" [size]="20"></lucide-icon>
      <span>Back</span>
    </button>

    <div class="logo" routerLink="/">
      <div class="logo-icon">
        <lucide-icon name="shopping-bag" [size]="28"></lucide-icon>
      </div>
      <h1>Good <span>Market</span></h1>
    </div>

    <!-- Global Search (not home) -->
    <div class="header-search" *ngIf="!isHomePage && !isCompactHeader">
      <input
        type="text"
        placeholder="Search..."
        [(ngModel)]="searchTerm"
        (keyup.enter)="performSearch()"
      />
      <lucide-icon name="search" [size]="20" (click)="performSearch()"> </lucide-icon>
    </div>

    <!-- Logged User -->
    <ng-container *ngIf="!isCompactHeader; else guest">
      <ng-container *ngIf="user$ | async as user; else guest">
        <div class="actions">
          <!-- Theme Toggle -->
          <lucide-icon
            class="theme-icon"
            [name]="(darkMode$ | async) ? 'moon' : 'sun'"
            [size]="20"
            role="button"
            tabindex="0"
            title="Toggle dark mode"
            aria-label="Toggle dark mode"
            (click)="toggleDarkMode()"
            (keydown.enter)="toggleDarkMode()"
          ></lucide-icon>

          <div class="user-area">
            <span class="username" (click)="toggleDropdown($event)">
              {{ user.username }}
            </span>

            <div class="dropdown" [class.open]="dropdownOpen">
              <button class="dropdown-item" routerLink="/profile-settings">
                <lucide-icon name="settings" [size]="18"></lucide-icon>
                Profile Settings
              </button>

              <div class="dropdown-divider"></div>

              <button routerLink="/home" class="dropdown-item danger" (click)="logout()">
                <lucide-icon name="log-out" [size]="18"></lucide-icon>
                Logout
              </button>
            </div>
          </div>

          <div class="divider"></div>

          <!-- Cart -->
          <button class="icon-btn cart" (click)="goToCart()">
            <lucide-icon name="shopping-bag" [size]="22"></lucide-icon>
            <span class="badge">
              {{ (cartCount$ | async) || 0 }}
            </span>
          </button>
        </div>
      </ng-container>
    </ng-container>

    <!-- Guest -->
    <ng-template #guest>
      <div class="actions">
        <ng-container *ngIf="isCompactHeader; else fullGuest">
          <lucide-icon
            class="theme-icon"
            [name]="(darkMode$ | async) ? 'moon' : 'sun'"
            [size]="20"
            role="button"
            tabindex="0"
            title="Toggle dark mode"
            aria-label="Toggle dark mode"
            (click)="toggleDarkMode()"
            (keydown.enter)="toggleDarkMode()"
          ></lucide-icon>
        </ng-container>

        <ng-template #fullGuest>
          <!-- Theme Toggle -->
          <lucide-icon
            class="theme-icon"
            [name]="(darkMode$ | async) ? 'moon' : 'sun'"
            [size]="20"
            role="button"
            tabindex="0"
            title="Toggle dark mode"
            aria-label="Toggle dark mode"
            (click)="toggleDarkMode()"
            (keydown.enter)="toggleDarkMode()"
          ></lucide-icon>

          <button (click)="openLoginModal()" class="btn ghost">
            <lucide-icon name="user" [size]="20"></lucide-icon>
            <span>Login</span>
          </button>

          <button class="btn primary" routerLink="/signup">
            <lucide-icon name="user-plus" [size]="20"></lucide-icon>
            <span>Sign Up</span>
          </button>

          <div class="divider"></div>

          <button class="icon-btn cart" (click)="goToCart()">
            <lucide-icon name="shopping-bag" [size]="22"></lucide-icon>
            <span class="badge">
              {{ (cartCount$ | async) || 0 }}
            </span>
          </button>
        </ng-template>
      </div>
    </ng-template>
  </div>
</header>

<!-- Login Modal -->
<ng-container *ngIf="showLoginModal">
  <app-login-modal (close)="closeLoginModal()"></app-login-modal>
</ng-container>
